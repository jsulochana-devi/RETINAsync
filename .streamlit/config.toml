[global]
developmentMode = false

[server]
headless = true
port = 8501
enableCORS = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"

[theme]
base = "dark"
backgroundColor = "#050d1a"
secondaryBackgroundColor = "#0a1628"
primaryColor = "#38bdf8"
textColor = "#e2e8f0"
font = "sans serif"
